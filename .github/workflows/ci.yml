name: ULTRON OS 2026 Backend CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run full automated test suite
        run: pytest

      - name: Verify database schema & Supabase migrations
        run: python backend/scripts/verify_migrations.py

      - name: Verify integration diagnostic CLI
        run: python backend/scripts/verify_integrations.py

      - name: Verify persistent worker single cycle
        run: python backend/worker.py --once

      - name: Verify desktop device agent module
        run: python -m py_compile device_agent/ultron_desktop_agent.py

  frontend-pwa-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript check & Vite production build
        run: npm run build
